name: lab-checks

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python files
        run: python -m py_compile app.py checker.py attack.py test_lab.py
      - name: Run localhost integration tests
        run: python test_lab.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag adlab:ci .
      - name: Validate Compose file
        run: docker compose config
